<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Oğuz Çetin</title>
  <!-- Styles are inline on purpose: GitHub Pages serves this file for any
       missing address, so relative links to a stylesheet could break. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: clamp(2rem, 10vw, 6rem) 1rem;
      background: #f4f7f9;
      color: #172a33;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    main { width: min(100%, 40rem); margin-inline: auto; }
    p.code { margin: 0; color: #145b71; font-size: 0.8rem; font-weight: 780; letter-spacing: 0.13em; text-transform: uppercase; }
    h1 { margin: 0.4rem 0 0; font-size: clamp(2.1rem, 8vw, 3.6rem); letter-spacing: -0.06em; line-height: 1.08; }
    p { margin: 1rem 0 0; color: #405863; }
    a.home {
      display: inline-flex; min-height: 2.9rem; align-items: center; margin-top: 1.5rem; padding: 0.65rem 1.05rem;
      border-radius: 0.68rem; background: #145b71; color: #f4f7f9; font-weight: 710; text-decoration: none;
    }
    a.home:hover { background: #0c4659; }
    :focus-visible { outline: 3px solid #a63d00; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      body { background: #101b20; color: #edf4f5; }
      p.code { color: #8bd7dd; }
      p { color: #c2d0d4; }
      a.home { background: #8bd7dd; color: #101b20; }
      a.home:hover { background: #b2eff0; }
      :focus-visible { outline-color: #ffd18a; }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>The address may be mistyped, or the page may have moved.</p>
    <a class="home" href="./">Go to the portfolio home page</a>
  </main>
</body>
</html>
